[package]
name = "aletheia"
version = "0.1.0"
description = "Local browser privacy audit: logged-in sites, saved-credential sites, cache usage"
authors = ["Aletheia contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aletheia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
